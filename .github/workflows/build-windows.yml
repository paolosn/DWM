name: Build Windows installer (DWM Desktop)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias del monorepo
        run: npm install

      - name: Instalar y verificar 7zip-bin para Windows
        shell: pwsh
        run: |
          npm install --no-save 7zip-bin@5.2.0

          $sevenZip = "node_modules\7zip-bin\win\x64\7za.exe"

          if (-not (Test-Path $sevenZip)) {
            Write-Error "No se encontró el ejecutable requerido: $sevenZip"
            exit 1
          }

          Write-Host "7zip-bin verificado correctamente:"
          Get-Item $sevenZip

      - name: Compilar paquetes internos
        run: npm run build:internal-deps

      - name: Generar instalador Windows NSIS
        run: npm run package:electron:win -w packages/desktop-app

      - name: Calcular checksums SHA-256
        shell: pwsh
        run: |
          $release = "packages\desktop-app\release"
          $checksumFile = Join-Path $release "SHA256SUMS.txt"

          if (Test-Path $checksumFile) {
            Remove-Item $checksumFile
          }

          Get-ChildItem -Path $release -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)" |
                Out-File -FilePath $checksumFile -Append -Encoding utf8
            }

      - name: Subir instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: DWM-Windows
          path: |
            packages/desktop-app/release/*.exe
            packages/desktop-app/release/*.blockmap
            packages/desktop-app/release/*.yml
            packages/desktop-app/release/SHA256SUMS.txt
          if-no-files-found: error